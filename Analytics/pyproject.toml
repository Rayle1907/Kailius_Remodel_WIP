[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kailius-preprocessing"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pandas==2.3.3", "pyarrow==22.0.0", "scikit-learn==1.7.2", "joblib==1.5.2"]

[project.optional-dependencies]
pdf = ["reportlab==5.1.0"]

[tool.setuptools.packages.find]
include = ["kailius_preprocessing*"]
